<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md transition-all" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-label-md text-label-md uppercase tracking-wider shadow-md hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all flex items-center justify-center gap-sm mt-base" id="submit-btn" type="submit">
<span id="btn-text">Sign In</span>

                <a class="text-primary font-semibold hover:underline" href="#">Request Access</a>
</p>

</main>
<script>
    let currentTab = 'author';

    function switchTab(type) {
        const indicator = document.getElementById('toggle-indicator');
        const authorBtn = document.getElementById('tab-author');
        const adminBtn = document.getElementById('tab-admin');
        
        if (type === 'author') {
            indicator.style.transform = 'translateX(0)';
            authorBtn.classList.add('text-primary');
            authorBtn.classList.remove('text-on-surface-variant');
            adminBtn.classList.remove('text-primary');
            adminBtn.classList.add('text-on-surface-variant');
        } else {
            indicator.style.transform = 'translateX(100%)';
            indicator.style.left = '4px'; 
            adminBtn.classList.add('text-primary');
            adminBtn.classList.remove('text-on-surface-variant');
            authorBtn.classList.remove('text-primary');
            authorBtn.classList.add('text-on-surface-variant');
        }
        currentTab = type;
    }

    function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const text = document.getElementById('btn-text');
        const spinner = document.getElementById('btn-spinner');

        btn.disabled = true;
        text.textContent = 'Verifying...';
        spinner.classList.remove('hidden');

        setTimeout(() => {
            btn.style.backgroundColor = '#2d4d3d'; // Success green tailored to theme
            text.textContent = 'Success';
            spinner.classList.add('hidden');
            
            setTimeout(() => {
                alert(`Welcome back to BookLeaf ${currentTab === 'author' ? 'Author' : 'Admin'} Portal!`);
                btn.disabled = false;
                btn.style.backgroundColor = '';
                text.textContent = 'Sign In';
            }, 500);
        }, 1800);
    }

    document.addEventListener('mousemove', (e) => {
        const card = document.querySelector('.glass-card');
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        if (x > 0 && x < rect.width && y > 0 && y < rect.height) {
            card.style.boxShadow = `${(x - rect.width/2)/25}px ${(y - rect.height/2)/25}px 35px rgba(167, 54, 69, 0.1)`;
        } else {
            card.style.boxShadow = '0px 4px 24px rgba(167, 54, 69, 0.06)';
        }
    });
</script>
